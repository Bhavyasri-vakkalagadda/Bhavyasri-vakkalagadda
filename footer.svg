<svg width="100%" height="180" viewBox="0 0 1200 180"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="180" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="600" cy="180" rx="500" ry="90"
           fill="#8b5cf6"
           opacity="0.12"
           filter="url(#softGlow)">
    <animate attributeName="opacity"
             values="0.08;0.18;0.08"
             dur="4s"
             repeatCount="indefinite"/>
  </ellipse>

  <!-- Animated wave 1 -->
  <path d="M0 125
           C150 70 250 180 400 120
           S650 65 800 120
           S1050 175 1200 105"
        fill="none"
        stroke="url(#line)"
        stroke-width="3"
        opacity="0.8"
        filter="url(#glow)">

    <animate
      attributeName="d"
      dur="5s"
      repeatCount="indefinite"
      values="
      M0 125 C150 70 250 180 400 120 S650 65 800 120 S1050 175 1200 105;
      M0 105 C150 165 250 65 400 130 S650 180 800 110 S1050 65 1200 125;
      M0 125 C150 70 250 180 400 120 S650 65 800 120 S1050 175 1200 105"/>
  </path>

  <!-- Animated wave 2 -->
  <path d="M0 145
           C180 100 280 165 430 135
           S700 90 850 135
           S1050 160 1200 125"
        fill="none"
        stroke="#38bdf8"
        stroke-width="1.5"
        opacity="0.35">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 25 -5; 0 0"
      dur="6s"
      repeatCount="indefinite"/>
  </path>

  <!-- Floating particles -->
  <g fill="#ffffff">

    <circle cx="120" cy="55" r="2" opacity="0.5">
      <animate attributeName="cy"
               values="55;35;55"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="280" cy="90" r="1.5" opacity="0.4">
      <animate attributeName="cy"
               values="90;65;90"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="520" cy="45" r="2" opacity="0.6">
      <animate attributeName="cy"
               values="45;25;45"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="760" cy="70" r="1.5" opacity="0.5">
      <animate attributeName="cy"
               values="70;45;70"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="980" cy="40" r="2" opacity="0.5">
      <animate attributeName="cy"
               values="40;20;40"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1100" cy="85" r="1.5" opacity="0.4">
      <animate attributeName="cy"
               values="85;60;85"
               dur="4.5s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Center text -->
  <text x="600"
        y="65"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="700"
        letter-spacing="3">
    KEEP BUILDING • KEEP LEARNING
  </text>

  <text x="600"
        y="94"
        text-anchor="middle"
        fill="#94a3b8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        letter-spacing="1">
    Turning ideas into things people can actually use
  </text>

  <!-- GitHub-style bottom line -->
  <line x1="420" y1="115" x2="780" y2="115"
        stroke="url(#line)"
        stroke-width="2"
        filter="url(#glow)">
    <animate attributeName="x1"
             values="420;500;420"
             dur="4s"
             repeatCount="indefinite"/>
    <animate attributeName="x2"
             values="780;700;780"
             dur="4s"
             repeatCount="indefinite"/>
  </line>

  <!-- Footer -->
  <text x="600"
        y="150"
        text-anchor="middle"
        fill="#64748b"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12">
    © 2026 • Built with curiosity &amp; code
  </text>

</svg>
